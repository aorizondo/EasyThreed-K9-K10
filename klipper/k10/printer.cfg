# ============================================================================
#  printer.cfg — EasyThreed K10 con Klipper (hack USB). PLANTILLA: NO IMPRIME.
#
#  Klipper ya corre en la placa y comunica por USB, pero faltan pines del
#  reversing (klipper/firmware/k10/reversing.md). Los "P??" impiden arrancar
#  a propósito: complétalos con multímetro (klipper/docs/10) antes de mover
#  motores o calentar. El pin del calentador es el más importante (seguridad).
#
#  Datos de fábrica (k10_cfg.txt): 100x100x100, pasos/mm X606 Y606 Z600 E1040,
#  corrientes X/Y 700 mA, Z/E 800 mA (fijas por hardware en los HR4988),
#  todas las direcciones invertidas, PID 22.2/1.08/114.
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_CAMBIAR-if00   # ls /dev/serial/by-id/*
# Vía B/C (UART USART1): serial: /dev/ttyAMA0  +  baud: 250000

[printer]
kinematics: cartesian
max_velocity: 20                # fábrica: 20 mm/s
max_accel: 1000
max_z_velocity: 10
max_z_accel: 50

# ----------------------------------------------------------------------------
#  Motores. Candidatos del reversing (eje SIN asignar; grupo poco fiable):
#    STEP: PC15, PC13, PA9    DIR: PC14, PA8, PA10    ENABLE: PB3, PA1
#    (PA11/PA12 salían también como STEP/DIR, pero aquí son el USB.)
#  rotation_distance = 200*16 / pasos_mm (microstepping 1/16 por confirmar).
# ----------------------------------------------------------------------------
[stepper_x]
step_pin: P??
dir_pin: !P??
enable_pin: !P??
microsteps: 16
rotation_distance: 5.2805       # 606 pasos/mm
endstop_pin: ^PA3               # único final de carrera encontrado; eje por confirmar
position_endstop: 0
position_max: 100
homing_speed: 10

[stepper_y]
step_pin: P??
dir_pin: !P??
enable_pin: !P??
microsteps: 16
rotation_distance: 5.2805       # 606 pasos/mm
endstop_pin: P??                # sin final de carrera: usar SET_KINEMATIC_POSITION
position_endstop: 100           # fábrica: Y hace homing hacia el MÁXIMO
position_max: 100

[stepper_z]
step_pin: P??
dir_pin: !P??
enable_pin: !P??
microsteps: 16
rotation_distance: 5.3333       # 600 pasos/mm
endstop_pin: P??
position_endstop: 0
position_max: 100

[extruder]
step_pin: P??
dir_pin: !P??
enable_pin: !P??
microsteps: 16
rotation_distance: 3.0769       # 1040 pasos/mm
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P??                 # 🔴 SIN RESOLVER: gate del MOSFET HY1403 (candidatos PA4/PA15/PB9 o PWM PB4-PB8)
sensor_type: EPCOS 100K B57560G104F   # NTC 100k probable: verificar a temperatura ambiente
sensor_pin: PA2                 # alta confianza (único ADC usado)
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 260                   # fábrica 275
min_extrude_temp: 170

[fan]
pin: P??                        # uno de los PWM PB4/PB5 (TIM3) o PB6/PB7/PB8 (TIM4)

[force_move]
enable_force_move: True         # cero manual con SET_KINEMATIC_POSITION X=0 Y=100 Z=0

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
