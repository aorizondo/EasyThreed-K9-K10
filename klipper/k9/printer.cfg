# ============================================================================
#  printer.cfg — EasyThreed K9 de serie con Klipper (placa ET4000+ = MKS Robin Lite)
#
#  ⚠️ SIN PROBAR EN UNA K9 COMPLETA. Pines y firmware verificados en la misma
#  placa (STM32F103RC) montada en otra máquina; geometría, pasos y corrientes
#  sacados de la config de fábrica (lite_cfg.txt) y del Marlin de este repo.
#  Todo lo marcado VERIFICAR hay que comprobarlo antes de imprimir.
#
#  Solo para la revisión de placa con STM32F103RC. La revisión con AT32F403
#  (Artery) NO está soportada (ver klipper/README.md).
#  Firmware: klipper/k9/README.md.
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   # CH340 en USART1. VERIFICAR: ls /dev/serial/by-id/*
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
# Fábrica: 20 mm/s y 1000 mm/s² (valores conservadores; mecánica pequeña)
max_velocity: 40
max_accel: 1000
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 100

# ============================================================================
#  Corriente de los A4988: Vref por PWM (equivale a M907 de Marlin, en A).
#  Fábrica: XY 800 mA, Z 750 mA, E 800 mA. X e Y comparten canal.
# ============================================================================
[output_pin _vref_xy]
pin: PB0
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 0.8

[output_pin _vref_z]
pin: PA7
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 0.75

[output_pin _vref_e]
pin: PA6
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 0.8

[gcode_macro M907]
description: Corriente de motores en mA (X=XY, Z, E), tope 1200 mA
gcode:
  {% for axis, pin in [('X', '_vref_xy'), ('Y', '_vref_xy'), ('Z', '_vref_z'), ('E', '_vref_e')] %}
    {% if axis in params %}
      SET_PIN PIN={pin} VALUE={[params[axis]|float / 1000, 1.2]|min}
    {% endif %}
  {% endfor %}

# ============================================================================
#  Ejes: pasos/mm de fábrica 606/606/600/1040 con A4988 a 1/16
#  -> rotation_distance = 200*16 / pasos_mm. ENABLE compartido en PB10.
#  Finales de carrera: conectores X (PC13), Y (PC0), Z- (PC12) de la placa.
#  Pulsado = LOW con pull-up (como en Marlin, *_ENDSTOP_INVERTING 1). VERIFICAR
#  con QUERY_ENDSTOPS: suelto = open, pulsado = TRIGGERED; si sale al revés,
#  quitar el "!".
#  Sin finales de carrera (algunas K9 modificadas): ver klipper/k9/README.md.
# ============================================================================
[stepper_x]
step_pin: PC6
dir_pin: !PB12                  # INVERT_X_DIR true. VERIFICAR con jog
enable_pin: !PB10
microsteps: 16
rotation_distance: 5.2805       # 606 pasos/mm
endstop_pin: ^!PC13
position_endstop: 0
position_max: 100
homing_speed: 10

[stepper_y]
step_pin: PB11
dir_pin: !PB2                   # INVERT_Y_DIR true. VERIFICAR con jog
enable_pin: !PB10
microsteps: 16
rotation_distance: 5.2805       # 606 pasos/mm
endstop_pin: ^!PC0
position_endstop: 0
position_max: 100
homing_speed: 10

[stepper_z]
step_pin: PB1
dir_pin: !PC5                   # INVERT_Z_DIR true. VERIFICAR: Z+ debe alejar la cama de la boquilla
enable_pin: !PB10
microsteps: 16
rotation_distance: 5.3333       # 600 pasos/mm
endstop_pin: ^!PC12
position_endstop: 0
position_max: 100
homing_speed: 5

[extruder]
step_pin: PC4
dir_pin: !PA5                   # INVERT_E0_DIR true. VERIFICAR
enable_pin: !PA4
microsteps: 16
rotation_distance: 3.0769       # 1040 pasos/mm
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F   # TEMP_SENSOR_0 = 1
sensor_pin: PA0
control: pid                    # PID de fábrica; recalibrar: PID_CALIBRATE HEATER=extruder TARGET=200
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 260
min_extrude_temp: 170
max_extrude_only_distance: 100

[fan]
pin: PA8

# Sin cama caliente de serie (HAS_TEMP_BED 0). Con la cama opcional:
#[heater_bed]
#heater_pin: PC8
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PA1
#control: watermark
#min_temp: 0
#max_temp: 70

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

[force_move]
enable_force_move: True         # SET_KINEMATIC_POSITION (pruebas y K9 sin finales de carrera)
